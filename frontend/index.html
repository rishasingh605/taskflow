<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow — A premium task & project management system built with React. Manage tasks, projects, and teams with elegance." />
    <meta name="theme-color" content="#6c63ff" />
    <title>TaskFlow — Task Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background: #0a0b0f; color: #f1f3f9; margin: 0; min-height: 100vh;">
    <div id="debug-err" style="position:fixed;top:0;left:0;right:0;z-index:999999;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('debug-err');
        if (el) {
          el.innerHTML += '<div style="background:#ef4444;color:#fff;padding:16px;margin:10px;border-radius:8px;font-family:monospace;font-size:14px;white-space:pre-wrap;box-shadow:0 10px 25px rgba(0,0,0,0.5);">⚠️ Runtime Error: ' + (e.error ? (e.error.stack || e.error.message) : (e.message + ' at ' + e.filename + ':' + e.lineno)) + '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('debug-err');
        if (el) {
          el.innerHTML += '<div style="background:#f59e0b;color:#000;padding:16px;margin:10px;border-radius:8px;font-family:monospace;font-size:14px;white-space:pre-wrap;">⚠️ Promise Rejection: ' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : 'Unknown') + '</div>';
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
